[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caliber-agent"
version = "0.7.0"
description = "Caliber Agent — multi-model OpenRouter coding agent with full TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Caliber"}]
keywords = ["ai", "agent", "openrouter", "terminal", "llm", "tui"]
dependencies = [
    "openai>=1.40.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "prompt-toolkit>=3.0",
    "textual>=0.80.0",
]

[project.scripts]
caliberagent = "caliber.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["caliber*"]
